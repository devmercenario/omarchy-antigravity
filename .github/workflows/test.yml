name: Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install system dependencies
        run: |
          set -euo pipefail
          updated=0
          for attempt in 1 2 3 4 5; do
            echo "::group::apt-get update (attempt $attempt)"
            if sudo apt-get update; then
              updated=1
              echo "::endgroup::"
              break
            fi
            echo "::endgroup::"
            echo "apt-get update attempt $attempt failed; retrying in $((attempt * 5))s..."
            sleep $((attempt * 5))
          done
          if [[ "$updated" -ne 1 ]]; then
            echo "::error::apt-get update failed after 5 attempts"
            exit 1
          fi
          sudo apt-get install -y jq libsecret-tools

      - name: Run Full Test Suite
        run: |
          chmod +x tests/*.sh tests/*.py install.sh uninstall.sh bin/* hooks/post-update.d/*
          ./tests/run_tests.sh
